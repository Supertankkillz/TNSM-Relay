[package]
name = "tnsm-relay-gui"
version = "0.1.3"
edition = "2021"
description = "TNSM Relay control panel (GUI)."

[lib]
name = "tnsm_relay_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tnsm-relay-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tnsm-relay-core = { path = "../../core" }
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-http = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = { version = "0.5", features = ["std"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
