[package]
name = "tnsm-relay"
version = "0.1.0"
edition = "2021"
description = "TNSM relay — headless always-on service binary."

[[bin]]
name = "tnsm-relay"
path = "src/main.rs"

[dependencies]
tnsm-relay-core = { path = "../core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
# For the `gen-hash` subcommand (produce an Argon2 hash to paste into config).
argon2 = { version = "0.5", features = ["std"] }

[profile.release]
opt-level = 3
lto = true
strip = true
